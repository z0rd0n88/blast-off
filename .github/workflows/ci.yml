# ci: blast-off's gate (D15) on every pull request: tests/run, every scenario plus shellcheck -S warning.
# Tests 10-12 drive `systemctl --user` and `systemd-run --user --scope`, so the runner user's systemd
# manager is started first (linger); without one they fail, never skip. shellcheck is pinned to the
# version on the build box (0.11.0) so CI and a local gate judge the same warnings. A red run leaves the
# artifact blast-off-tests: blast-off-tests.tgz, every scenario's work dir (its output, cwd and run.log).
# A dispatch may name scenarios in `only` for a diagnosis; that run is not the gate and its verdict line
# says so (GATE-ONLY:, tests/run's BLAST_OFF_TEST_ONLY). A pull request always runs the whole suite.
name: ci
on:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these scenarios (e.g. 30-paused-limit; several split by spaces or commas). Empty: the whole gate."
        type: string
        default: ""
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (D14; bash, jq, python3, systemd ship with the image)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          git config --global user.name blast-off-ci
          git config --global user.email blast-off-ci@localhost
      - name: User systemd manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          rt="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$rt" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$rt/bus" >> "$GITHUB_ENV"
          for _ in $(seq 60); do [ -S "$rt/bus" ] && break; sleep 1; done
          XDG_RUNTIME_DIR="$rt" systemctl --user is-system-running --wait || true
          XDG_RUNTIME_DIR="$rt" systemctl --user show -p Version
      - name: tests/run
        # A hung gate fails this step inside the job's 30 minutes, so the two steps below still run;
        # on a job timeout or a cancel they do not, and nothing is uploaded.
        timeout-minutes: 25
        env:
          # every finished scenario's work dir (output, job dirs, run.log), for the artifact below
          BLAST_OFF_TEST_KEEP: ${{ runner.temp }}/blast-off-tests
          # the dispatch input, empty on a pull request (the whole suite). Through env, never written into
          # the script below: there its text would be shell. tests/run fails on a name that is no scenario
          BLAST_OFF_TEST_ONLY: ${{ inputs.only }}
        run: |
          # The owner's launch env may carry these into a job; test 21 then fails (P2R3-6).
          unset JOB_MAX_CHILDREN JOB_CAP_FACTOR JOB_KEEP_WINDOWS JOB_SESSION JOB_CHILD_TIMEOUT
          tmux -V; shellcheck --version | sed -n 2p
          tests/run
      # One tar file, not the tree: upload-artifact refuses a whole tree for one file name holding any of
      # " : < > | * ? CR LF (22-dirty-tree leaves a line feed), drops dot files (every .git) and follows
      # symlinks. tests/00-harness.sh runs the tar line as written: keep it one line, and its names in step
      # with the env above and the path below. Both steps also run, and fail, when a step before the gate
      # failed and there is nothing to keep.
      - name: Tar the scenario work dirs of a failed run
        if: failure()
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/blast-off-tests.tgz" blast-off-tests
      - name: Upload them (artifact blast-off-tests)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blast-off-tests
          path: ${{ runner.temp }}/blast-off-tests.tgz
          if-no-files-found: error
